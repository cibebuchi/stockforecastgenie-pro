name: Refresh FRED snapshot

on:
  workflow_dispatch:
  schedule:
    # 02:00 UTC Tue-Sat = after the prior U.S. trading day in both EDT/EST.
    - cron: "0 2 * * 2-6"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install refresh dependencies
        run: pip install pandas requests

      - name: Refresh FRED data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python refresh_fred_data.py

      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- market_daily_data_2015_to_present.csv; then
            echo "No FRED snapshot changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_daily_data_2015_to_present.csv
          git commit -m "Refresh FRED market snapshot"
          git push
